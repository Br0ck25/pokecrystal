<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#263e4b">
  <title>Pokémon Crystal</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #11191f;
      color: #f4f5f7;
      --shell: #344f5e;
      --shell-edge: #1a303a;
      --pink: #d96d9b;
      --pink-edge: #823d62;
      --blue: #7389d8;
      --blue-edge: #3d4d8b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      min-height: 100dvh;
      padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      display: flex;
      justify-content: center;
      align-items: center;
      overscroll-behavior: none;
      background: radial-gradient(ellipse at 50% 20%, #273b45 0%, #11191f 72%);
    }
    main {
      container-type: inline-size;
      width: min(calc(100vw - 16px), calc((100dvh - 16px) / 1.52), 560px);
      max-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5dvh;
    }
    .device {
      width: 100%;
      padding: 4cqw;
      border: 2px solid #506c7a;
      border-right-color: #203741;
      border-bottom-color: #203741;
      border-radius: 6cqw;
      background: linear-gradient(145deg, #496575, var(--shell) 45%, #2b4653);
      box-shadow: 0 8px 0 var(--shell-edge), 0 18px 34px #0007, inset 0 1px 0 #ffffff22;
    }
    .screen-bezel {
      padding: 2.4cqw;
      border: 2px solid #17252d;
      border-radius: 12px 12px 18px 18px;
      background: #10191e;
      box-shadow: inset 0 2px 5px #000b;
    }
    .screen-label {
      margin: 0 0 1.6cqw;
      color: #9db5c0;
      text-align: center;
      font-size: 2.6cqw;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .screen {
      overflow: hidden;
      width: 100%;
      aspect-ratio: 10 / 9;
      border: 2px solid #090f12;
      background: #d9e8c8;
      box-shadow: 0 0 0 1px #526b58;
      contain: strict;
      display: grid;
      place-items: center;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      outline: none;
    }
    .controls-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      align-items: center;
      gap: 5cqw;
      padding: 5px 2px 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 11cqw);
      grid-template-rows: repeat(3, 11cqw);
      justify-content: center;
      align-content: center;
      filter: drop-shadow(0 3px 0 #1b3039);
    }
    .dpad button {
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 1px solid #111c22;
      border-radius: 5px;
      background: linear-gradient(145deg, #27323a, #111a20);
      color: #dfe8eb;
      font-size: 5cqw;
      font-weight: 800;
      touch-action: none;
    }
    .dpad .up { grid-column: 2; grid-row: 1; border-radius: 6px 6px 2px 2px; }
    .dpad .left { grid-column: 1; grid-row: 2; border-radius: 6px 2px 2px 6px; }
    .dpad .down { grid-column: 2; grid-row: 3; border-radius: 2px 2px 6px 6px; }
    .dpad .right { grid-column: 3; grid-row: 2; border-radius: 2px 6px 6px 2px; }
    .dpad .center { grid-column: 2; grid-row: 2; background: #111a20; }
    .action-area { display: flex; justify-content: center; align-items: center; gap: 3cqw; transform: rotate(-16deg); }
    .action {
      width: 15cqw;
      height: 15cqw;
      padding: 0;
      border: 2px solid #ffffff44;
      border-right-color: #0005;
      border-bottom-color: #0006;
      border-radius: 50%;
      color: #fff;
      font-size: 5cqw;
      font-weight: 900;
      box-shadow: inset 0 2px 2px #ffffff30, 0 4px 0 #1b3039;
      touch-action: manipulation;
    }
    .action[data-action="a"] { background: linear-gradient(145deg, #ed8bb3, var(--pink)); box-shadow: inset 0 2px 2px #ffffff40, 0 4px 0 var(--pink-edge); }
    .action[data-action="b"] { background: linear-gradient(145deg, #8e9fe9, var(--blue)); box-shadow: inset 0 2px 2px #ffffff40, 0 4px 0 var(--blue-edge); }
    button:active { filter: brightness(1.2); transform: translateY(2px); }
    .bottom-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 6px 0 12cqw; }
    .system-keys, .save-keys { display: flex; gap: 14px; }
    .system-keys button, .save-keys button {
      width: 11cqw; height: 3cqw; padding: 0; border: 1px solid #14242c; border-radius: 10px;
      background: #1a2b34; box-shadow: inset 0 1px 2px #0008; transform: rotate(-18deg);
    }
    .system-keys span, .save-keys span { display: block; margin-top: 4cqw; color: #a6bdc7; font-size: 2.2cqw; font-weight: 800; letter-spacing: .12em; text-align: center; }
    #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  </style>
</head>
<body>
  <main aria-label="Pokémon Crystal game">
    <section class="device" aria-label="Game Boy Color style game console">
      <div class="screen-bezel">
        <p class="screen-label">Color · Pocket Game</p>
        <div class="screen">
          <canvas id="map" width="320" height="288" tabindex="0" aria-label="Pokémon Crystal game screen"></canvas>
        </div>
      </div>
      <div class="controls-row">
        <div class="dpad" aria-label="Directional pad">
          <button class="up" data-move="ArrowUp" aria-label="Move up">▲</button>
          <button class="left" data-move="ArrowLeft" aria-label="Move left">◀</button>
          <button class="down" data-move="ArrowDown" aria-label="Move down">▼</button>
          <button class="right" data-move="ArrowRight" aria-label="Move right">▶</button>
          <div class="center" aria-hidden="true"></div>
        </div>
        <div class="action-area" aria-label="A and B buttons">
          <button class="action" type="button" data-action="b" aria-label="B button: cancel or close dialogue">B</button>
          <button class="action" type="button" data-action="a" aria-label="A button: interact or confirm">A</button>
        </div>
      </div>
      <div class="bottom-row">
      <div class="system-keys">
        <div><button type="button" data-action="select" aria-label="Select"></button><span>SELECT</span></div>
        <div><button type="button" data-action="start" aria-label="Start: open the menu"></button><span>START</span></div>
      </div>
      <div class="save-keys">
        <div><button type="button" id="export-save" aria-label="Export save file"></button><span>EXPORT</span></div>
        <div><button type="button" id="import-save" aria-label="Import save file"></button><span>IMPORT</span></div>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
      </div>
      </div>
    </section>
    <div id="status" role="status" aria-live="polite">Loading…</div>
  </main>
  <script>
    window.addEventListener("error", function (event) {
      var status = document.getElementById("status");
      if (status) {
        status.dataset.kind = "dialogue";
        status.textContent = "Game startup failed: " + (event.message || "A game module could not load.") + " Refresh after deployment completes.";
      }
    });
    window.addEventListener("unhandledrejection", function (event) {
      var status = document.getElementById("status");
      if (status) {
        status.dataset.kind = "dialogue";
        status.textContent = "Game startup failed: " + (event.reason && event.reason.message || String(event.reason || "Unexpected error"));
      }
    });
  </script>
  <script type="module" src="./app.js?v=gameboy-pixel9-20261025"></script>
</body>
</html>
